[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kingcon_python"
version = "0.1.0"
description = "A modern Python project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
kingcon = "kingcon_python.cli:main"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
